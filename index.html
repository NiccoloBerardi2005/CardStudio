<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: usa tutto lo schermo (notch iPhone); i margini di sicurezza sono gestiti nel CSS -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Meta Apple: "Aggiungi alla schermata Home" (iPhone/iPad) o "Aggiungi al Dock" (Safari su Mac) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Card Studio">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1623" media="(prefers-color-scheme: dark)">
<title>Card Studio</title>
<style>
  /* ---------- Colori: un solo accento (evidenziatore giallo), il resto resta neutro ---------- */
  :root{
    --bg:#EEF1F4; --paper:#FFFFFF; --ink:#142033; --muted:#5B6678; --line:#D5DBE3;
    --mark:#FFD84D; --on-mark:#142033;
    --ok:#17743F; --ok-bg:#DDF3E4; --bad:#B03030; --bad-bg:#F9DEDE;
    --serif: ui-serif, "New York", Georgia, serif;   /* su Apple = New York */
    --sans: -apple-system, system-ui, "SF Pro Text", "Helvetica Neue", sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0F1623; --paper:#182133; --ink:#EAF0F8; --muted:#9AA7BA; --line:#2A364B;
      --ok:#6FD99A; --ok-bg:#123A25; --bad:#FF8A8A; --bad-bg:#43191C; }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink); font:17px/1.5 var(--sans);
    /* margini di sicurezza per notch e barra Home */
    padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right))
            max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  }
  main{ max-width:720px; margin:0 auto; }
  h1{ font:700 28px/1.2 var(--serif); margin:8px 0 20px; }
  h2{ font:600 18px/1.3 var(--sans); margin:0 0 12px; }
  .card{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; }
  label{ display:block; font-size:15px; color:var(--muted); margin:14px 0 6px; }
  input[type=text],input[type=password],select{
    width:100%; min-height:48px; padding:10px 12px; font:inherit; font-size:17px; /* >=16px evita lo zoom di iOS */
    color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:12px;
  }
  .row{ display:flex; gap:10px; align-items:stretch; }
  .row > input{ flex:1; min-width:0; }
  button{
    font:600 17px var(--sans); min-height:52px; padding:12px 18px; border-radius:14px;
    border:1px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer;
    touch-action:manipulation;
  }
  button:active{ transform:scale(.98); }
  button:disabled{ opacity:.55; cursor:default; }
  button.primary{ background:var(--mark); color:var(--on-mark); border-color:transparent; }
  button.block{ width:100%; margin-top:12px; }
  :focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }
  .files{ list-style:none; padding:0; margin:12px 0 0; font-size:15px; color:var(--muted); }
  .files li{ padding:6px 0; border-top:1px solid var(--line); word-break:break-word; }
  .status{ min-height:24px; margin:12px 2px 0; font-size:15px; color:var(--muted); }
  .status.err{ color:var(--bad); }
  [hidden]{ display:none !important; }

  /* ---------- Studio ---------- */
  .meta{ display:flex; justify-content:space-between; font-size:15px; color:var(--muted); margin-bottom:8px; }
  .bar{ height:10px; background:var(--line); border-radius:6px; overflow:hidden; margin-bottom:20px; }
  .bar i{ display:block; height:100%; width:0; background:var(--mark); transition:width .3s; }
  .q{ font:600 23px/1.35 var(--serif); margin:0 0 20px; }
  .opts{ display:grid; gap:12px; }
  .opt{ display:flex; gap:12px; align-items:flex-start; text-align:left; font-weight:500; width:100%; min-height:60px; }
  .opt .k{ flex:none; width:28px; height:28px; border-radius:8px; background:var(--bg); display:grid; place-items:center; font-size:15px; font-weight:700; }
  .opt.ok{ background:var(--ok-bg); border-color:var(--ok); }
  .opt.bad{ background:var(--bad-bg); border-color:var(--bad); }
  .opt:disabled{ opacity:1; cursor:default; }
  .fb{ margin-top:18px; padding:16px; border-radius:14px; border:1px solid var(--line); }
  .fb.ok{ background:var(--ok-bg); border-color:var(--ok); }
  .fb.bad{ background:var(--bad-bg); border-color:var(--bad); }
  .fb strong{ display:block; margin-bottom:6px; }
  .score{ font:700 64px/1 var(--serif); margin:8px 0 6px; }
  @media (min-width:700px){ body{ font-size:18px; } .q{ font-size:27px; } .card{ padding:28px; } }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<main>
  <h1>Card Studio</h1>

  <!-- ===================== SCHERMATA 1: impostazioni e dispense ===================== -->
  <section id="viewSetup">
    <div class="card">
      <h2>Dispense</h2>
      <!-- Apre l'app File / iCloud Drive; si possono scegliere più PDF insieme -->
      <input id="pdfInput" type="file" accept=".pdf,application/pdf" multiple hidden>
      <button class="block primary" id="btnPick" style="margin-top:0">Scegli PDF da File / iCloud Drive</button>
      <ul class="files" id="fileList"></ul>
    </div>

    <div class="card">
      <h2>Impostazioni</h2>
      <label for="apiKey">Chiave API Gemini (salvata solo su questo dispositivo)</label>
      <div class="row">
        <input id="apiKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Incolla la chiave">
        <button id="btnShowKey" type="button" aria-pressed="false">Mostra</button>
      </div>
      <label for="model">Modello</label>
      <input id="model" type="text" autocapitalize="off" spellcheck="false">
      <label for="count">Numero di card</label>
      <select id="count">
        <option>5</option><option selected>10</option><option>15</option><option>20</option>
      </select>
    </div>

    <button class="block primary" id="btnGen" disabled>Genera il mazzo</button>
    <button class="block" id="btnLoad">Carica mazzo da file (.json)</button>
    <input id="deckInput" type="file" accept=".json,application/json" hidden>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <!-- ===================== SCHERMATA 2: studio a card singola ===================== -->
  <section id="viewStudy" hidden>
    <div class="meta"><span id="progLabel"></span><span id="scoreLabel"></span></div>
    <div class="bar"><i id="progBar"></i></div>
    <div class="card">
      <p class="q" id="qText"></p>
      <div class="opts" id="opts"></div>
      <div class="fb" id="fb" hidden role="status" aria-live="polite"></div>
      <button class="block primary" id="btnNext" hidden></button>
    </div>
  </section>

  <!-- ===================== SCHERMATA 3: riepilogo ===================== -->
  <section id="viewSummary" hidden>
    <div class="card">
      <h2>Risultato</h2>
      <div class="score" id="finalScore"></div>
      <p id="finalMsg" style="color:var(--muted);margin:0 0 8px"></p>
      <button class="block primary" id="btnRetryWrong">Ripeti solo le sbagliate</button>
      <button class="block" id="btnRetryAll">Rifai tutto il mazzo</button>
      <button class="block" id="btnSaveDeck">Salva mazzo su File (.json)</button>
      <button class="block" id="btnHome">Nuovo mazzo</button>
    </div>
  </section>
</main>

<script>
"use strict";
/* =====================================================================
   Card Studio: quiz generati con Gemini a partire dai tuoi PDF.
   Tutto gira nel browser: nessun server, nessun dato inviato tranne
   il testo dei PDF verso l'API di Gemini quando premi "Genera".
   ===================================================================== */
const $ = id => document.getElementById(id);

/* ---------- Archivio locale (try/catch: Safari in navigazione privata può rifiutarlo) ---------- */
const store = {
  get(k, d = "") { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

/* ---------- Stato ---------- */
let pdfTexts = [];      // [{name, pages, chars, text}]
let deck = [];          // mazzo completo (generato o caricato)
let deckSources = [];   // nomi dei PDF da cui deriva il mazzo
let run = null;         // sessione di studio corrente
let locked = false;     // blocca i pulsanti dopo la risposta

/* ---------- Utilità ---------- */
function setStatus(msg, isErr = false) { const s = $("status"); s.textContent = msg; s.className = "status" + (isErr ? " err" : ""); }
function show(view) { for (const v of ["viewSetup", "viewStudy", "viewSummary"]) $(v).hidden = (v !== view); window.scrollTo(0, 0); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* Mescola le 4 opzioni, così la risposta giusta non sta sempre nella stessa posizione */
function shuffleOptions(c) {
  const idx = shuffle([0, 1, 2, 3]);
  return { ...c, opzioni: idx.map(i => c.opzioni[i]), risposta_corretta: idx.indexOf(c.risposta_corretta) };
}

/* Controlla che una card abbia esattamente 4 opzioni e un indice valido */
function validCard(c) {
  return c && typeof c.domanda === "string" && Array.isArray(c.opzioni) && c.opzioni.length === 4 &&
    c.opzioni.every(o => typeof o === "string") && Number.isInteger(c.risposta_corretta) &&
    c.risposta_corretta >= 0 && c.risposta_corretta <= 3 && typeof c.spiegazione === "string";
}

/* ---------- Impostazioni salvate ---------- */
$("apiKey").value = store.get("cs_key");
$("model").value = store.get("cs_model", "gemini-2.5-flash");
$("count").value = store.get("cs_count", "10");
$("apiKey").addEventListener("input", e => store.set("cs_key", e.target.value.trim()));
$("model").addEventListener("input", e => store.set("cs_model", e.target.value.trim()));
$("count").addEventListener("change", e => store.set("cs_count", e.target.value));
$("btnShowKey").addEventListener("click", e => {
  const k = $("apiKey"), show = k.type === "password";
  k.type = show ? "text" : "password";
  e.target.textContent = show ? "Nascondi" : "Mostra";
  e.target.setAttribute("aria-pressed", String(show));
});

/* =====================================================================
   PDF.js: caricato solo al primo uso. Il worker viene scaricato e avviato
   da un Blob locale: evita i blocchi cross-origin dei Worker su Safari.
   ===================================================================== */
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfReady = null;
function loadPdfJs() {
  if (pdfReady) return pdfReady;
  pdfReady = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = PDFJS + "pdf.min.js";
    s.onload = async () => {
      try {
        const code = await (await fetch(PDFJS + "pdf.worker.min.js")).text();
        pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
      } catch { pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; }
      resolve();
    };
    s.onerror = () => { pdfReady = null; reject(new Error("Impossibile caricare PDF.js. Controlla la connessione.")); };
    document.head.appendChild(s);
  });
  return pdfReady;
}

async function extractPdf(file) {
  await loadPdfJs();
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let text = "";
  for (let p = 1; p <= pdf.numPages; p++) {
    const content = await (await pdf.getPage(p)).getTextContent();
    text += content.items.map(i => i.str).join(" ") + "\n";
  }
  return { name: file.name, pages: pdf.numPages, text: text.replace(/[ \t]+/g, " ").trim() };
}

/* ---------- Selezione dei PDF ---------- */
$("btnPick").addEventListener("click", () => $("pdfInput").click());
$("pdfInput").addEventListener("change", async e => {
  const files = [...e.target.files];
  e.target.value = "";
  if (!files.length) return;
  $("btnGen").disabled = true;
  pdfTexts = [];
  $("fileList").innerHTML = "";
  for (const f of files) {
    setStatus("Leggo " + f.name + "…");
    const li = document.createElement("li");
    try {
      const r = await extractPdf(f);
      r.chars = r.text.length;
      pdfTexts.push(r);
      li.textContent = r.chars < 50
        ? `${r.name}: nessun testo trovato (PDF scansionato?)`
        : `${r.name}: ${r.pages} pagine, ${r.chars.toLocaleString("it-IT")} caratteri`;
    } catch (err) { li.textContent = `${f.name}: errore di lettura (${err.message})`; }
    $("fileList").appendChild(li);
  }
  const usable = pdfTexts.filter(p => p.chars >= 50);
  $("btnGen").disabled = !usable.length;
  setStatus(usable.length ? "Pronto: scegli il numero di card e genera il mazzo." : "Nessun testo estraibile dai file scelti.", !usable.length);
});

/* =====================================================================
   Generazione con Gemini: JSON strutturato, solo dal testo dei PDF
   ===================================================================== */
const MAX_CHARS = 400000;   // limite prudenziale sul testo inviato
const SYSTEM = "Sei un docente universitario che prepara quiz di verifica. Usa ESCLUSIVAMENTE le informazioni contenute nel testo delle dispense fornito: " +
  "non aggiungere nozioni esterne e non inventare dati. Scrivi in italiano. Ogni domanda deve essere chiara, precisa e pertinente. " +
  "Ogni domanda ha esattamente 4 opzioni plausibili, di cui una sola corretta, e una spiegazione dettagliata che cita il concetto della dispensa. " +
  "Distribuisci le domande su tutti gli argomenti del testo, senza ripeterti.";

$("btnGen").addEventListener("click", async () => {
  const key = $("apiKey").value.trim();
  if (!key) return setStatus("Inserisci la chiave API di Gemini nelle impostazioni.", true);
  const sources = pdfTexts.filter(p => p.chars >= 50);
  let text = sources.map(p => `### DISPENSA: ${p.name}\n${p.text}`).join("\n\n");
  let note = "";
  if (text.length > MAX_CHARS) { text = text.slice(0, MAX_CHARS); note = " (testo troppo lungo: uso i primi " + MAX_CHARS.toLocaleString("it-IT") + " caratteri)"; }
  const n = parseInt($("count").value, 10);

  $("btnGen").disabled = true;
  setStatus("Genero " + n + " card…" + note);
  try {
    const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" +
      encodeURIComponent($("model").value.trim() || "gemini-2.5-flash") + ":generateContent", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: SYSTEM }] },
        contents: [{ role: "user", parts: [{ text: `Genera esattamente ${n} domande a risposta multipla dal testo seguente.\n\n=== TESTO DELLE DISPENSE ===\n${text}` }] }],
        generationConfig: {
          temperature: 0.3,
          responseMimeType: "application/json",
          responseSchema: {
            type: "ARRAY",
            items: {
              type: "OBJECT",
              properties: {
                domanda: { type: "STRING" },
                opzioni: { type: "ARRAY", items: { type: "STRING" } },
                risposta_corretta: { type: "INTEGER" },
                spiegazione: { type: "STRING" }
              },
              required: ["domanda", "opzioni", "risposta_corretta", "spiegazione"]
            }
          }
        }
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error?.message || ("Errore HTTP " + res.status));
    const raw = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("");
    const cards = JSON.parse(raw.replace(/```json|```/g, "").trim()).filter(validCard);
    if (!cards.length) throw new Error("Il modello non ha restituito card valide. Riprova.");
    deck = cards;
    deckSources = sources.map(p => p.name);
    setStatus("");
    start(deck);
  } catch (err) {
    setStatus("Generazione non riuscita: " + err.message, true);
  } finally { $("btnGen").disabled = false; }
});

/* =====================================================================
   Salvataggio / caricamento del mazzo (.json) per sincronizzare i dispositivi
   ===================================================================== */
async function saveDeck() {
  const payload = { versione: 1, creato: new Date().toISOString(), fonti: deckSources, carte: deck };
  const name = "mazzo-" + new Date().toISOString().slice(0, 10) + ".json";
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const file = new File([blob], name, { type: "application/json" });
  // iPhone/iPad: il foglio di condivisione offre "Salva su File" (scegli la cartella iCloud Drive)
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  // Mac e altri browser: download classico
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$("btnSaveDeck").addEventListener("click", saveDeck);

$("btnLoad").addEventListener("click", () => $("deckInput").click());
$("deckInput").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    const cards = (Array.isArray(j) ? j : j.carte || []).filter(validCard);
    if (!cards.length) throw new Error("nessuna card valida nel file");
    deck = cards; deckSources = j.fonti || [];
    setStatus("");
    start(deck);
  } catch (err) { setStatus("File non valido: " + err.message, true); }
});

/* =====================================================================
   Studio a card singola
   ===================================================================== */
function start(cards) {
  run = { cards: shuffle(cards).map(shuffleOptions), i: 0, score: 0, wrong: [] };
  show("viewStudy");
  render();
}

function render() {
  const c = run.cards[run.i], total = run.cards.length;
  locked = false;
  $("progLabel").textContent = `Card ${run.i + 1} di ${total}`;
  $("scoreLabel").textContent = `Corrette: ${run.score}`;
  $("progBar").style.width = (run.i / total * 100) + "%";
  $("qText").textContent = c.domanda;
  $("fb").hidden = true; $("btnNext").hidden = true;
  const box = $("opts"); box.innerHTML = "";
  c.opzioni.forEach((txt, k) => {
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button";
    const key = document.createElement("span"); key.className = "k"; key.textContent = "ABCD"[k];
    const t = document.createElement("span"); t.textContent = txt;
    b.append(key, t);
    b.addEventListener("click", () => answer(k));
    box.appendChild(b);
  });
}

function answer(k) {
  if (locked) return;           // evita i doppi tocchi
  locked = true;
  const c = run.cards[run.i], right = c.risposta_corretta, btns = [...document.querySelectorAll(".opt")];
  btns.forEach(b => b.disabled = true);
  btns[right].classList.add("ok");
  const fb = $("fb");
  fb.hidden = false;
  fb.textContent = "";
  const title = document.createElement("strong");
  const body = document.createElement("span");
  body.textContent = c.spiegazione;
  if (k === right) {
    run.score++;
    fb.className = "fb ok"; title.textContent = "Corretto.";
  } else {
    btns[k].classList.add("bad");
    run.wrong.push(c);
    fb.className = "fb bad"; title.textContent = "Risposta sbagliata. Ecco perché:";
  }
  fb.append(title, body);
  $("scoreLabel").textContent = `Corrette: ${run.score}`;
  $("progBar").style.width = ((run.i + 1) / run.cards.length * 100) + "%";
  const next = $("btnNext");
  next.textContent = run.i + 1 < run.cards.length ? "Prossima card" : "Vedi il risultato";
  next.hidden = false;
  next.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

$("btnNext").addEventListener("click", () => {
  if (run.i + 1 < run.cards.length) { run.i++; render(); window.scrollTo(0, 0); }
  else summary();
});

/* ---------- Riepilogo finale ---------- */
function summary() {
  const total = run.cards.length, ok = run.score, pct = ok / total;
  $("finalScore").textContent = `${ok}/${total}`;
  $("finalMsg").textContent = pct === 1 ? "Tutte giuste." : pct >= 0.7 ? "Buon risultato: ripassa le sbagliate per chiudere." : "Rileggi la dispensa e riprova con le card sbagliate.";
  $("btnRetryWrong").hidden = run.wrong.length === 0;
  $("btnRetryWrong").textContent = `Ripeti solo le sbagliate (${run.wrong.length})`;
  show("viewSummary");
}
$("btnRetryWrong").addEventListener("click", () => start(run.wrong));
$("btnRetryAll").addEventListener("click", () => start(deck));
$("btnHome").addEventListener("click", () => show("viewSetup"));
</script>
</body>
</html>
